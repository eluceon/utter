name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Pinned, not `ubuntu-latest`. A binary links against the glibc of the
    # machine that built it and will not start on anything older: built on
    # 24.04 it demands GLIBC_2.39, so the published .deb died at exec time on
    # Ubuntu 22.04 with `version 'GLIBC_2.39' not found`. Nothing catches
    # that earlier -- the bundle's Depends names only the webkit/gtk
    # libraries, so apt installs it happily. Building on the oldest release
    # we support makes the floor glibc 2.35, which every newer distribution
    # satisfies. Raise this only together with the minimum in the README.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config build-essential cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: install frontend dependencies
        working-directory: apps/desktop/ui
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Utter ${{ github.ref_name }}"
          releaseDraft: true
          args: --bundles deb,appimage --features sherpa
