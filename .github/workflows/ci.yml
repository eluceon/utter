name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config build-essential cmake
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: cargo fmt --check
      # Deliberately `--all-targets` without `--all-features`: the `sherpa`
      # feature (utter-stt, utter-desktop) downloads a prebuilt native
      # archive on first build (see crates/utter-stt/Cargo.toml), which CI
      # and offline builds must opt into deliberately. The default feature
      # set (whisper.cpp + cloud STT) is what's linted and tested here,
      # matching CONTRIBUTING.md's documented gate.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - working-directory: apps/desktop/ui
        run: npm ci
      - working-directory: apps/desktop/ui
        run: npm test
      - working-directory: apps/desktop/ui
        run: npm run check
      - working-directory: apps/desktop/ui
        run: npm run build
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install system dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config build-essential cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # windows/macos check with the default feature set only (whisper.cpp +
      # cloud STT, no `sherpa`); utter-inject's evdev/uinput backends are
      # `#[cfg(target_os = "linux")]`-gated behind non-Linux stubs, so the
      # workspace compiles everywhere without platform-specific features.
      - run: cargo check --workspace
